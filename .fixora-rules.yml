rules:
- id: fixora-wrapper-trigger-webhook
  patterns:
  - pattern-inside: "def trigger_webhook(...):\n  ..."
  - pattern-either:
    - pattern: requests.get(...)
    - pattern: $OBJ.get(...)
    - pattern: get(...)
  message: 'SSRF via `data.get(''url'')`

    Vulnerable Sink: Passes untrusted data directly to `requests.get`.'
  severity: ERROR
  languages:
  - python
  metadata:
    category: security
    technology:
    - python
    source: fixora-ai-analysis
    vulnerability_type: SSRF
    confidence: HIGH
    wrapper_defined_in: backend/medium.py
    wraps:
    - requests.get
    modules_used:
    - requests
    vulnerable_parameter: data.get('url')
    malicious_payload: http://localhost:8080
    exploit_explanation: The attacker-controlled URL is passed directly to requests.get,
      allowing SSRF attacks.
    exploit_injected_example: trigger_webhook(data.get('url') = http://localhost:8080)
    impact_summary: Attackers can access internal services and potentially exfiltrate
      sensitive data.
    cwe:
    - CWE-918
    owasp:
    - A10:2021
